name: Build meshoptimizer Python wheel

on:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

      - name: Install binary build dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: `
            numpy `
            cython `
            meson-python `
            setuptools `
            wheel `
            build

      - name: Download meshoptimizer source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force source | Out-Null

          python -m pip download `
            --no-binary=:all: `
            --no-deps `
            meshoptimizer==0.2.30a0 `
            --dest source

      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null

          $archive = Get-ChildItem "source\meshoptimizer-*.tar.gz" |
            Select-Object -First 1

          if (-not $archive) {
            throw "meshoptimizer source archive was not downloaded."
          }

          tar -xzf $archive.FullName -C package

          $src = Get-ChildItem package -Directory |
            Select-Object -First 1

          if (-not $src) {
            throw "Could not find extracted source directory."
          }

          Write-Host "Source directory: $($src.FullName)"

      - name: Build wheel without isolation
        shell: pwsh
        run: |
          $src = Get-ChildItem package -Directory |
            Select-Object -First 1

          New-Item -ItemType Directory -Force dist | Out-Null

          python -m build `
            --wheel `
            --no-isolation `
            --outdir dist `
            "$($src.FullName)"

      - name: Test wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "dist\*.whl" |
            Select-Object -First 1

          if (-not $wheel) {
            throw "No wheel was produced."
          }

          Write-Host "Testing: $($wheel.FullName)"

          python -m pip install `
            --force-reinstall `
            --no-deps `
            $wheel.FullName

          python -c "import meshoptimizer; print('meshoptimizer import OK:', meshoptimizer.__file__)"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: meshoptimizer-windows-python-wheel
          path: dist/*.whl
          if-no-files-found: error
