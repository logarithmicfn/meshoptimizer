name: Build meshoptimizer Python wheel

on:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download meshoptimizer source
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          New-Item -ItemType Directory -Force source | Out-Null
          python -m pip download `
            --no-binary=:all: `
            --no-deps `
            meshoptimizer==0.2.30a0 `
            --dest source

      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null

          $archive = Get-ChildItem "source\meshoptimizer-*.tar.gz" | Select-Object -First 1

          if (-not $archive) {
            throw "meshoptimizer source archive was not downloaded."
          }

          Write-Host "Extracting $($archive.FullName)"
          tar -xzf $archive.FullName -C package

          Write-Host "Extracted files:"
          Get-ChildItem package

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade build wheel setuptools numpy

      - name: Build wheel
        shell: pwsh
        run: |
          $src = Get-ChildItem "package" -Directory | Select-Object -First 1

          if (-not $src) {
            throw "Could not find extracted meshoptimizer source directory."
          }

          Write-Host "Building from $($src.FullName)"

          python -m build `
            --wheel `
            --outdir dist `
            $src.FullName

      - name: Test wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "dist\*.whl" | Select-Object -First 1

          if (-not $wheel) {
            throw "No wheel was produced."
          }

          Write-Host "Testing $($wheel.FullName)"

          python -m pip install --force-reinstall --no-deps $wheel.FullName

          python -c "import meshoptimizer; print('Import successful:', meshoptimizer.__file__)"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: meshoptimizer-windows-python-wheel
          path: dist/*.whl
          if-no-files-found: error
